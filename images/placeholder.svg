<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151a2b"/>
      <stop offset=".55" stop-color="#2a2f5a"/>
      <stop offset="1" stop-color="#3c8f7c"/>
    </linearGradient>
    <radialGradient id="glow" cx="1180" cy="330" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bfe9dc" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#6cc4ae" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6cc4ae" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spear" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4d47"/>
      <stop offset=".5" stop-color="#e6fff7"/>
      <stop offset="1" stop-color="#2f6f63"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1219" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f1219" stop-opacity=".75"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- Stars -->
  <g fill="#e9e7e1">
    <circle cx="140" cy="120" r="2"/><circle cx="320" cy="210" r="1.4"/><circle cx="510" cy="90" r="1.8"/><circle cx="690" cy="170" r="1.2"/>
    <circle cx="860" cy="70" r="2.2"/><circle cx="1010" cy="150" r="1.3"/><circle cx="1420" cy="110" r="1.8"/><circle cx="1580" cy="200" r="1.2"/>
    <circle cx="1740" cy="80" r="2"/><circle cx="1850" cy="250" r="1.4"/><circle cx="250" cy="330" r="1.1"/><circle cx="1650" cy="330" r="1.1"/>
    <circle cx="420" cy="300" r="1"/><circle cx="1500" cy="40" r="1.2"/><circle cx="60" cy="260" r="1.3"/><circle cx="1300" cy="220" r="1"/>
  </g>
  <circle cx="1180" cy="330" r="420" fill="url(#glow)"/>
  <!-- Far hills -->
  <path d="M0 700 C 220 600 420 640 620 600 S 1020 520 1260 590 S 1680 560 1920 620 V1080 H0 Z" fill="#2f5a63" opacity=".75"/>
  <path d="M0 780 C 260 700 520 760 760 700 S 1240 650 1500 720 S 1800 700 1920 730 V1080 H0 Z" fill="#26484f"/>
  <!-- The spear hill: a hill rising into a slender spear-shaped peak -->
  <path d="M520 1080 C 700 900 900 820 1060 700 C 1110 650 1150 520 1180 300 C 1210 520 1250 650 1300 700 C 1460 820 1660 900 1840 1080 Z" fill="#1c3a3f"/>
  <path d="M1180 300 C 1165 450 1150 560 1120 640 L 1180 610 L 1240 640 C 1210 560 1195 450 1180 300 Z" fill="url(#spear)" opacity=".85"/>
  <!-- Near hills -->
  <path d="M0 900 C 240 840 460 880 700 860 S 1120 900 1360 880 S 1760 860 1920 900 V1080 H0 Z" fill="#162a30"/>
  <rect width="1920" height="1080" fill="url(#fade)"/>
  <!-- Wordmark -->
  <text x="960" y="955" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="86" font-weight="700" fill="#e9e7e1" letter-spacing="2">Spearhill</text>
  <text x="960" y="1012" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="30" fill="#a3d9cb" letter-spacing="10">COMING SOON</text>
</svg>
